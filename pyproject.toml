[project]
name = "landscape-generator"
version = "0.1.0"
description = "Automated technology landscape generation for harness engineering"
requires-python = ">=3.11"
dependencies = ["click>=8.1.7", "pyyaml>=6.0.1", "requests>=2.31.0", "pydantic>=2.0", "jinja2>=3.1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "mypy>=1.10.0", "types-PyYAML>=6.0.0", "pydantic>=2.0"]

[project.scripts]
landscape = "tools.landscape.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
# enableReachabilityAnalysis = true
python.analysis.include = ["tests/**", "tools/**"]
venvPath = "."
venv = ".venv"
